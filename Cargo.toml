[package]
name = "konvert"
version = "0.2.0"
edition = "2024"
authors = ["enesehs <enesehs@protonmail.com>"]
description = "Fast, lightweight, privacy-focused native right-click file converter and optimizer for Linux and KDE Plasma."
license = "GPL-3.0-or-later"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25", features = ["jpeg", "png", "webp", "bmp", "ico", "tiff"] }
rayon = "1.10"
notify-rust = "4.11"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
anyhow = "1.0"
directories = "5.0"
zip = { version = "9.5.0", default-features = false, features = ["deflate"] }
serde_json = "1.0.154"
libc = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap_complete = "4.6.11"

[[bin]]
name = "konvert"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
