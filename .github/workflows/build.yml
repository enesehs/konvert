name: Build & Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package (Linux ${{ matrix.target.arch }})
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - arch: x86_64
            runner: ubuntu-latest
            deb_arch: amd64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            deb_arch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Flatpak Manifest & Packaging Metadata
        run: |
          python3 -m json.tool packaging/io.github.enesehs.konvert.json > /dev/null
          chmod +x packaging/build-deb.sh packaging/update-checksums.sh scripts/*.sh

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qt6-base-dev \
            libqt6svg6-dev \
            librsvg2-bin \
            cmake \
            ninja-build \
            libpoppler-cpp-dev \
            libjxl-tools \
            ffmpeg \
            imagemagick

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Rust CLI (konvert)
        run: cargo build --release

      - name: Rustfmt Check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Tests
        run: cargo test --release

      - name: Build Qt6 Settings GUI (konvert-settings)
        run: |
          rm -rf gui/build
          cmake -B gui/build -S gui -GNinja -DCMAKE_BUILD_TYPE=Release
          ninja -C gui/build

      - name: Build Debian (.deb) Package
        run: |
          rm -f packaging/*.deb packaging/*.sha256 *.deb *.sha256
          DEB_ARCH="${{ matrix.target.deb_arch }}" ./packaging/build-deb.sh
          cp packaging/*.deb .

      - name: Package Release Bundle
        run: |
          ARCH="${{ matrix.target.arch }}"
          VERSION="$(tr -d 'v' < VERSION | tr -d ' \n\r')"
          PKG_NAME="konvert-linux-${ARCH}"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            PKG_NAME="konvert-${{ github.ref_name }}-linux-${ARCH}"
          fi
          mkdir -p "${PKG_NAME}"
          cp target/release/konvert "${PKG_NAME}/"
          cp gui/build/konvert-settings "${PKG_NAME}/"
          cp scripts/install.sh "${PKG_NAME}/"
          cp scripts/uninstall.sh "${PKG_NAME}/"
          chmod +x "${PKG_NAME}/install.sh" "${PKG_NAME}/uninstall.sh" 2>/dev/null || true
          cp io.github.enesehs.konvert.desktop "${PKG_NAME}/"
          cp -r assets "${PKG_NAME}/"
          cp -r packaging "${PKG_NAME}/"
          mkdir -p "${PKG_NAME}/docs"
          cp docs/konvert.1 "${PKG_NAME}/docs/"
          cp README.md "${PKG_NAME}/"
          if [ -f LICENSE ]; then cp LICENSE "${PKG_NAME}/"; fi

          tar -czvf "${PKG_NAME}.tar.gz" "${PKG_NAME}"
          rm -rf "${PKG_NAME}"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: konvert-binaries-${{ matrix.target.arch }}
          path: |
            konvert-*.tar.gz
            *.deb

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: konvert-binaries-*
          merge-multiple: true

      - name: Prepare Release Manifest & Notes
        run: |
          # 1. Generate clean unified SHA256SUMS.txt
          rm -f *.sha256 SHA256SUMS.txt
          sha256sum konvert-*.tar.gz *.deb > SHA256SUMS.txt

          # 2. Extract release notes from CHANGELOG.md for the current tag
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit;
              if (index($0, "[" ver "]") > 0) { found=1; next }
            }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md || true

          if [ ! -s RELEASE_NOTES.md ]; then
            echo "Release ${GITHUB_REF_NAME}" > RELEASE_NOTES.md
          fi

          # 3. Append Quick Install and Checksum table
          printf "\n---\n\n### Quick Install\n\n\`\`\`bash\n# Universal one-line installer:\ncurl -sSL https://enesehs.dev/konvert/install.sh | bash\n\n# Or install Debian / Ubuntu package:\nsudo dpkg -i konvert_%s_amd64.deb\n\`\`\`\n\n### Verification (SHA-256)\n\`\`\`text\n" "${VERSION}" >> RELEASE_NOTES.md
          cat SHA256SUMS.txt >> RELEASE_NOTES.md
          printf "\`\`\`\n" >> RELEASE_NOTES.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Konvert ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            konvert-*.tar.gz
            *.deb
            SHA256SUMS.txt
          draft: false
          prerelease: ${{ contains(github.ref, '-beta') || contains(github.ref, '-alpha') || contains(github.ref, '-rc') }}
