name: Build & Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package (Linux ${{ matrix.target.arch }})
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - arch: x86_64
            runner: ubuntu-latest
            deb_arch: amd64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            deb_arch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Flatpak Manifest & Packaging Metadata
        run: |
          python3 -m json.tool packaging/io.github.enesehs.konvert.json > /dev/null
          chmod +x packaging/build-deb.sh packaging/update-checksums.sh scripts/*.sh

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qt6-base-dev \
            libqt6svg6-dev \
            librsvg2-bin \
            cmake \
            ninja-build \
            libpoppler-cpp-dev \
            libjxl-tools \
            ffmpeg \
            imagemagick

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Rust CLI (konvert)
        run: cargo build --release

      - name: Rustfmt Check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Tests
        run: cargo test --release

      - name: Build Qt6 Settings GUI (konvert-settings)
        run: |
          rm -rf gui/build
          cmake -B gui/build -S gui -GNinja -DCMAKE_BUILD_TYPE=Release
          ninja -C gui/build

      - name: Build Debian (.deb) Package
        run: |
          DEB_ARCH="${{ matrix.target.deb_arch }}" ./packaging/build-deb.sh
          sha256sum packaging/*.deb > "packaging/deb-${{ matrix.target.arch }}.sha256"
          cp packaging/*.deb .
          cp "packaging/deb-${{ matrix.target.arch }}.sha256" .

      - name: Package Release Bundle
        run: |
          ARCH="${{ matrix.target.arch }}"
          PKG_NAME="konvert-linux-${ARCH}"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            PKG_NAME="konvert-${{ github.ref_name }}-linux-${ARCH}"
          fi
          mkdir -p "${PKG_NAME}"
          cp target/release/konvert "${PKG_NAME}/"
          cp gui/build/konvert-settings "${PKG_NAME}/"
          cp scripts/install.sh "${PKG_NAME}/"
          cp scripts/uninstall.sh "${PKG_NAME}/"
          chmod +x "${PKG_NAME}/install.sh" "${PKG_NAME}/uninstall.sh" 2>/dev/null || true
          cp io.github.enesehs.konvert.desktop "${PKG_NAME}/"
          cp -r assets "${PKG_NAME}/"
          cp -r packaging "${PKG_NAME}/"
          mkdir -p "${PKG_NAME}/docs"
          cp docs/konvert.1 "${PKG_NAME}/docs/"
          cp README.md "${PKG_NAME}/"
          if [ -f LICENSE ]; then cp LICENSE "${PKG_NAME}/"; fi

          tar -czvf "${PKG_NAME}.tar.gz" "${PKG_NAME}"
          sha256sum "${PKG_NAME}.tar.gz" > "${PKG_NAME}.tar.gz.sha256"
          
          # Also ensure universal 'konvert-linux-<arch>.tar.gz' is available for remote installer
          if [ "${PKG_NAME}" != "konvert-linux-${ARCH}" ]; then
            cp "${PKG_NAME}.tar.gz" "konvert-linux-${ARCH}.tar.gz"
            sha256sum "konvert-linux-${ARCH}.tar.gz" > "konvert-linux-${ARCH}.tar.gz.sha256"
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: konvert-binaries-${{ matrix.target.arch }}
          path: |
            konvert-*.tar.gz
            konvert-*.tar.gz.sha256
            *.deb
            *.sha256

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: konvert-binaries-*
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            konvert-*.tar.gz
            konvert-*.tar.gz.sha256
            *.deb
            *.sha256
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-beta') || contains(github.ref, '-alpha') || contains(github.ref, '-rc') }}
